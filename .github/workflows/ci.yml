name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository. Without an explicit
# block the job inherits whatever the repository default is, which on older repos
# is read/write — meaning a compromised dependency could push commits using the
# automatic GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Record resolved environment
        run: pip list --format=freeze

      # Kept identical to `make lint`. When the two drift, the local gate stops
      # predicting the remote one, and this project has already been bitten twice
      # by trusting a green local run.
      - name: Lint
        run: ruff check src tests scripts

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest -m "not network" --cov --cov-report=term-missing
